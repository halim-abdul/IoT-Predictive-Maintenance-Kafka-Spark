[build-system]
requires = ["setuptools>=68","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-predictive-maintenance"
version = "0.1.0"
description = "Streaming industrial equipment health research platform"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","pandas>=2.0","scikit-learn>=1.3","pydantic>=2.0","pydantic-settings>=2.0"]

[project.optional-dependencies]
stream = ["kafka-python>=2.0","pyspark>=3.5"]
api = ["fastapi>=0.110","uvicorn>=0.27"]
dashboard = ["streamlit>=1.30","plotly>=5.18"]
dev = ["pytest>=8.0","ruff>=0.5","mypy>=1.10","httpx>=0.27","jupyterlab>=4.0"]

[project.scripts]
iot-generate = "iot_pm.simulation.generator:main"
iot-predict = "iot_pm.ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
